plugins {
    id 'net.neoforged.moddev' version '2.0.141'
}

version = "${mod_version}+${minecraft_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

def repoRoot = rootProject.projectDir.parentFile.parentFile

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    main {
        resources {
            srcDir new File(repoRoot, 'common/src/main/resources')
        }
    }
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = "Modrinth Maven"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "KubeJS Maven"
        url = "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
        }
    }
}

configurations {
    goetyProduction {
        canBeConsumed = false
        transitive = false
    }
}

dependencies {
    compileOnly "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"
    compileOnly "dev.latvian.mods:rhino:${rhino_version}"
    compileOnly "maven.modrinth:goety:${goety_modrinth_file}"
    goetyProduction "maven.modrinth:goety:${goety_modrinth_file}"
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'    : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }

    from(new File(repoRoot, 'NOTICE.md')) {
        into ''
    }
    from(new File(repoRoot, 'LICENSE.txt')) {
        into ''
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('test', Test) {
    exclude '**/BrewLevelOwnershipTest.class', '**/BrewMixinMappingTest.class'
    exclude '**/ResearchPayloadTest.class'
}

tasks.register('testBrewLevelOwnership', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.output + sourceSets.main.output + sourceSets.main.compileClasspath
    mainClass = 'com.kubejs.goety.brew.BrewLevelOwnershipTest'
}

tasks.register('testBrewMixinMapping', JavaExec) {
    dependsOn tasks.named('testClasses'), tasks.named('jar')
    classpath = sourceSets.test.output + sourceSets.main.output + sourceSets.main.compileClasspath
    mainClass = 'com.kubejs.goety.brew.BrewMixinMappingTest'
    doFirst {
        args tasks.named('jar', Jar).get().archiveFile.get().asFile.absolutePath,
                providers.gradleProperty('goetyProductionJar').getOrElse(configurations.goetyProduction.singleFile.absolutePath)
    }
}

tasks.named('check') {
    dependsOn tasks.named('testBrewLevelOwnership'), tasks.named('testBrewMixinMapping'), tasks.named('testResearchPayload')
}

tasks.register('testResearchPayload', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.output + sourceSets.main.output + sourceSets.main.compileClasspath
    mainClass = 'com.kubejs.goety.research.ResearchPayloadTest'
}
