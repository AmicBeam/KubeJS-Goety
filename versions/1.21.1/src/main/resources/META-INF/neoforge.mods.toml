modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/AmicBeam/KubeJS-Goety"
logoFile="logo.png"
credits="Integration mod for KubeJS and Goety. 1.21.1 feature port pending. Limited early 1.20.1 bridge/index-table details referenced RevelationFix by MegaDarkness (ARR); see the packaged NOTICE.md for exact scope."
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="kubejs"
type="required"
versionRange="[2101.7.2,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="goety"
type="required"
versionRange="[3.1.4,)"
ordering="AFTER"
side="BOTH"
